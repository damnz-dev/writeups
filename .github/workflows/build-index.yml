name: Build writeups index

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "scripts/build_index.py"
      - "!README.md"
      - "!**/README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Commit if changed
        run: |
          git config user.name "damnz-dev"
          git config user.email "354959975+damnz-dev@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(index): rebuild writeups index"
            git push
          else
            echo "Index already up to date."
          fi
