<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="t">
  <title id="t">DAMNZ — Case Files</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/><stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5eead4" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="10" fill="url(#bg)"/>
  <rect width="900" height="200" rx="10" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="199" rx="10" fill="none" stroke="#1f2a33"/>
  <rect x="0" y="-50" width="900" height="50" fill="url(#scan)">
    <animate attributeName="y" from="-50" to="200" dur="5s" repeatCount="indefinite"/>
  </rect>
  <g stroke="#5eead4" stroke-width="2" fill="none" stroke-opacity="0.8">
    <path d="M18 40V18H40"/><path d="M860 18H882V40"/><path d="M18 160V182H40"/><path d="M860 182H882V160"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="40" y="52" font-size="12" fill="#5eead4" fill-opacity="0.75" letter-spacing="2">ARCHIVE // damnz-dev/writeups</text>
    <text x="860" y="52" font-size="12" fill="#64748b" text-anchor="end" letter-spacing="2">REDACTED: FLAGS · CREDS · HOSTS</text>
    <text x="40" y="112" font-size="50" font-weight="700" fill="#e2e8f0" letter-spacing="8">CASE FILES</text>
    <rect x="40" y="126" width="210" height="3" fill="#5eead4"/>
    <text x="40" y="156" font-size="14" fill="#94a3b8">architecture · protocol seams · mitigations</text>
    <!-- stacked folders motif -->
    <g transform="translate(700 76)" stroke="#5eead4" fill="#0f172a">
      <path d="M24 0h40l8 10h64v62H24z" stroke-opacity="0.3"/>
      <path d="M12 10h40l8 10h64v62H12z" stroke-opacity="0.55"/>
      <path d="M0 20h40l8 10h64v62H0z" stroke-opacity="0.9"/>
      <rect x="14" y="48" width="54" height="5" fill="#5eead4" stroke="none" fill-opacity="0.8"/>
      <rect x="14" y="60" width="80" height="5" fill="#334155" stroke="none"/>
      <rect x="14" y="72" width="66" height="5" fill="#334155" stroke="none"/>
    </g>
  </g>
</svg>
